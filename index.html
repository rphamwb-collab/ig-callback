<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Login callback</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px}code{display:block;word-break:break-all;background:#f2f2f2;padding:10px;border-radius:8px}button{font:inherit;margin-top:10px;padding:8px 14px}</style>
</head><body>
<h1>Almost done</h1>
<p>Copy this whole address and paste it into the chat. Nothing is sent anywhere from this page.</p>
<code id="u"></code>
<button id="b">Copy</button>
<script>
var u=location.href;document.getElementById("u").textContent=u;
document.getElementById("b").onclick=function(){navigator.clipboard.writeText(u).then(function(){b.textContent="Copied"},function(){b.textContent="Select it by hand"})};
</script>
</body></html>
